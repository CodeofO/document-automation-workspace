[project]
name = "document-automation-workspace-backend"
version = "0.1.0"
description = "Document Automation Workspace FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0,<0.47.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "google-genai>=2.5.0",
    "python-dotenv>=1.0.0",
    "mammoth>=1.8.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pillow>=10.0.0",
    "bleach>=6.1.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["alembic/versions"]
# The repository .gitignore is an allow-list that does not (yet) cover every source folder.
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are left to the formatter; prompts and test payloads are intentionally long
    "B008",   # FastAPI's Depends()/File()/Form() defaults are idiomatic
    "B904",   # `raise ... from` inside except blocks: HTTP error translation is deliberate and widespread
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # environment must be configured before importing the app

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]
